[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
duvet-e2e = { path = "crates/duvet-e2e" }
duvet-e2e-rules = { path = "crates/duvet-e2e-rules" }
duvet-e2e-validator = { path = "crates/duvet-e2e-validator" }

# MLS
openmls = "=0.9.2"
openmls_basic_credential = "=0.6.0"
openmls_memory_storage = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"

# The RustCrypto versions openmls_rust_crypto 0.6.0 uses, so ours aren't built twice.
aes-gcm = "0.10"
ed25519-dalek = "2"
hkdf = "0.13"
sha2 = "0.11"
rand_core = "0.6"

# Storage: SQLCipher, natively and in the browser.
rusqlite = { version = "=0.43.0", default-features = false }
sqlite-wasm-rs = "=0.6.3"
sqlite-wasm-vfs = "=0.3.0"

# Formats
base64 = "0.22"
bs58 = "0.5.1"
ciborium = "0.2.2"
miniz_oxide = "0.9.1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["std", "serde"] }

# Errors and time
thiserror = "2"
web-time = "1.1"

# Secrets wiped from memory once used.
zeroize = "1.9"

# Bindings
flutter_rust_bridge = "=2.13.0"
keyring = "4.2.0"
wasm-bindgen = "=0.2.130"
