[package]
name = "duvet-e2e-wasm"
description = "The core's WebAssembly build, for the web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is for the browser: natively the crate is empty.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
duvet-e2e.workspace = true
serde.workspace = true
serde_json.workspace = true
# SQLite's host services (randomness, clock) from JavaScript.
sqlite-wasm-rs = { workspace = true, features = ["wasm-bindgen"] }
sqlite-wasm-vfs = { workspace = true, features = ["sahpool"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
zeroize.workspace = true

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
base64.workspace = true
ciborium.workspace = true
duvet-e2e-rules.workspace = true
duvet-e2e-validator.workspace = true
miniz_oxide.workspace = true
rusqlite.workspace = true
wasm-bindgen-test.workspace = true
