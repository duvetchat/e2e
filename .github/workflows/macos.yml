name: macOS

# The C ABI on macOS, as the desktop loads it: the binding's own checks and tests, its keyring's
# Keychain store included, then host-tests/bun under Bun 1.3.9, the one Electrobun 1.15.1 ships. On a
# pull request that changes the binding, the host tests, a manifest, the lock file or the toolchain
# (a dependency's bump is what changes the Keychain store or the macOS build), against the library
# it builds; started by hand with a release's tag, against that release's (artifacts.yml).
on:
  pull_request:
    branches: [main]
    paths:
      - "crates/duvet-e2e-ffi/**"
      - "host-tests/bun/**"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/macos.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "The release to test: artifacts-<commit>"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # On macOS the keyring is the Keychain: its store compiles with no warning, and the binding's
  # tests pass.
  binding:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Beside the image's own Rust: rust-toolchain.toml names 1.99.1.
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - run: cargo clippy --locked -p duvet-e2e-ffi --all-targets -- -D warnings
      - run: cargo test --locked -p duvet-e2e-ffi

  # The library under Bun, the keyring's cases against the runner's login keychain.
  bun:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      # Started by hand, the tests of the commit the release was built from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release }}
          persist-credentials: false
      # As artifacts.yml builds it, for macOS 14.0.
      - name: Build the library
        if: github.event_name == 'pull_request'
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo build --locked --release -p duvet-e2e-ffi
          echo "DUVET_E2E_FFI=$PWD/target/release/libduvet_e2e_ffi.dylib" >> "$GITHUB_ENV"
      - name: Download the release's library and check it against its SHA256SUMS
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/core" \
            --pattern macos-arm64-libduvet_e2e_ffi.dylib --pattern SHA256SUMS
          cd "$RUNNER_TEMP/core"
          grep '  macos-arm64-libduvet_e2e_ffi\.dylib$' SHA256SUMS | shasum -a 256 -c -
          echo "DUVET_E2E_FFI=$RUNNER_TEMP/core/macos-arm64-libduvet_e2e_ffi.dylib" >> "$GITHUB_ENV"
      - name: Install Bun 1.3.9
        run: |
          curl -sSfL -o "$RUNNER_TEMP/bun.zip" https://github.com/oven-sh/bun/releases/download/bun-v1.3.9/bun-darwin-aarch64.zip
          echo "cde6a4edf19cf64909158fa5a464a12026fd7f0d79a4a950c10cf0af04266d85  $RUNNER_TEMP/bun.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
      # A Keychain prompt nobody can answer would hold the step until its time ends.
      - name: host-tests/bun against the library
        timeout-minutes: 10
        working-directory: host-tests/bun
        run: '"$RUNNER_TEMP/bun-darwin-aarch64/bun" test'
