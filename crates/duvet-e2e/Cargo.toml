[package]
name = "duvet-e2e"
description = "Duvet's end-to-end encryption core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aes-gcm.workspace = true
base64.workspace = true
bs58.workspace = true
ciborium.workspace = true
duvet-e2e-rules.workspace = true
ed25519-dalek.workspace = true
hkdf.workspace = true
openmls.workspace = true
openmls_basic_credential.workspace = true
openmls_rust_crypto.workspace = true
openmls_traits.workspace = true
rusqlite = { workspace = true, features = ["cache"] }
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

# The browser: SQLCipher through sqlite-wasm-rs, randomness and time from the JS host.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
openmls = { workspace = true, features = ["js"] }
rusqlite = { workspace = true, features = ["bundled-sqlcipher", "ffi-sqlite-wasm-rs"] }
web-time.workspace = true

[features]
# Hooks only tests reach (`Core::fail_next_commit`); the crate's own tests turn it on below.
test-hooks = []

[dev-dependencies]
duvet-e2e = { workspace = true, features = ["test-hooks"] }
duvet-e2e-validator.workspace = true
tempfile = "3"
