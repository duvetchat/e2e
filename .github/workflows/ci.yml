name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      fuzz:
        description: "Run the fuzz job alone, as the nightly does"
        type: boolean
        default: false
  # The fuzz job, alone.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

# The fuzz runs, nightly or by hand, in a group of their own that waits instead of cancelling: a
# fuzz run and a run of the checks on the same branch never cancel each other.
concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.fuzz) && 'fuzz' || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !inputs.fuzz }}

env:
  CARGO_TERM_COLOR: always
  # The runner keeps /var/cache/duvet-e2e between runs: the registry, and a target directory per job.
  CARGO_HOME: /cache/cargo

# Every job runs in the same image, whose toolchain matches rust-toolchain.toml, so the runner's
# instances never install a toolchain into the home they share.
jobs:
  rust:
    if: github.event_name != 'schedule' && !inputs.fuzz
    runs-on: [self-hosted, linux, x64, duvet]
    container:
      image: docker.io/library/rust:1.99.1-bookworm
      volumes:
        - /var/cache/duvet-e2e:/cache
    env:
      CARGO_TARGET_DIR: /cache/target/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # What the nightly fuzz job builds, checked on every pull request: the core's `fuzzing`
      # feature, the fuzz crate, and its lock against the workspace's.
      - run: cargo clippy -p duvet-e2e --features fuzzing --locked -- -D warnings
      - run: cargo check --locked --manifest-path fuzz/Cargo.toml
      - name: fuzz/Cargo.lock holds the workspace's versions
        run: |
          pairs() { awk '/^name = /{name = $3} /^version = /{print name, $3}' "$1" | sort -u; }
          pairs Cargo.lock > /tmp/workspace.pairs
          pairs fuzz/Cargo.lock > /tmp/fuzz.pairs
          drift=$(awk 'NR == FNR { names[$1]; held[$0]; next } ($1 in names) && !($0 in held)' /tmp/workspace.pairs /tmp/fuzz.pairs)
          if [ -n "$drift" ]; then
            echo "fuzz/Cargo.lock holds versions the workspace's Cargo.lock doesn't:"
            echo "$drift"
            exit 1
          fi

  deny:
    if: github.event_name != 'schedule' && !inputs.fuzz
    runs-on: [self-hosted, linux, x64, duvet]
    container:
      image: docker.io/library/rust:1.99.1-bookworm
      volumes:
        - /var/cache/duvet-e2e:/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-deny 0.22.0
        run: |
          curl -sSfL -o /tmp/cargo-deny.tar.gz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.22.0/cargo-deny-0.22.0-x86_64-unknown-linux-musl.tar.gz
          echo "98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786  /tmp/cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp
          install /tmp/cargo-deny-0.22.0-x86_64-unknown-linux-musl/cargo-deny /usr/local/bin/
      - run: cargo deny --locked check

  wasm:
    if: github.event_name != 'schedule' && !inputs.fuzz
    runs-on: [self-hosted, linux, x64, duvet]
    container:
      image: docker.io/library/rust:1.99.1-bookworm
      volumes:
        - /var/cache/duvet-e2e:/cache
    env:
      CARGO_TARGET_DIR: /cache/target/wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SQLCipher's C is compiled for wasm32, which takes clang: the image has gcc alone.
      - run: apt-get update && apt-get install -y --no-install-recommends clang lld llvm
      - run: cargo build --locked --target wasm32-unknown-unknown -p duvet-e2e-rules -p duvet-e2e -p duvet-e2e-wasm

  # The C ABI the desktop loads: its header, and the library under Bun.
  ffi:
    if: github.event_name != 'schedule' && !inputs.fuzz
    runs-on: [self-hosted, linux, x64, duvet]
    container:
      image: docker.io/library/rust:1.99.1-bookworm
      volumes:
        - /var/cache/duvet-e2e:/cache
    env:
      CARGO_TARGET_DIR: /cache/target/ffi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Bun 1.3.9 is the one Electrobun 1.15.1 ships; its baseline build runs on any x86-64.
      - name: Install cbindgen 0.29.4 and Bun 1.3.9
        run: |
          apt-get update && apt-get install -y --no-install-recommends unzip
          curl -sSfL -o /tmp/cbindgen https://github.com/mozilla/cbindgen/releases/download/0.29.4/cbindgen-ubuntu22.04
          echo "27ac237e2ad3ffaffc8ecce0c03e3caa1d1b09e691906c3cb0967367ff6d783d  /tmp/cbindgen" | sha256sum -c -
          install /tmp/cbindgen /usr/local/bin/
          curl -sSfL -o /tmp/bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.3.9/bun-linux-x64-baseline.zip
          echo "104d4d037f4b35e10215c0507e1779691f39c57bd91ddeefe11cad781e3fc4b9  /tmp/bun.zip" | sha256sum -c -
          unzip -q /tmp/bun.zip -d /tmp && install /tmp/bun-linux-x64-baseline/bun /usr/local/bin/
      - run: cargo build --locked --release -p duvet-e2e-ffi
      # The header in the repository is cbindgen's output for the code as it is.
      - run: cbindgen --config cbindgen.toml --output include/duvet_e2e.h --verify
        working-directory: crates/duvet-e2e-ffi
      # No session bus runs here, so the keyring's test sees the fallback to a file.
      - run: bun test
        working-directory: host-tests/bun
        env:
          DUVET_E2E_FFI: /cache/target/ffi/release/libduvet_e2e_ffi.so

  # The core in WebAssembly, under Node: SQLCipher encrypts there too.
  wasm-test:
    if: github.event_name != 'schedule' && !inputs.fuzz
    runs-on: [self-hosted, linux, x64, duvet]
    container:
      image: docker.io/library/rust:1.99.1-bookworm
      volumes:
        - /var/cache/duvet-e2e:/cache
    env:
      CARGO_TARGET_DIR: /cache/target/wasm-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # wasm-bindgen's binaries match the version Cargo.lock holds, so wasm-pack downloads nothing.
      - name: Install clang, Node 24.22.3, wasm-pack 0.15.1 and wasm-bindgen 0.2.130
        run: |
          apt-get update && apt-get install -y --no-install-recommends clang lld llvm xz-utils
          curl -sSfL -o /tmp/node.tar.xz https://nodejs.org/dist/v24.22.3/node-v24.22.3-linux-x64.tar.xz
          echo "4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb  /tmp/node.tar.xz" | sha256sum -c -
          tar -xJf /tmp/node.tar.xz -C /opt && ln -s /opt/node-v24.22.3-linux-x64/bin/node /usr/local/bin/node
          curl -sSfL -o /tmp/wasm-pack.tar.gz https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.1/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz
          echo "410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2  /tmp/wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp && install /tmp/wasm-pack-v0.15.1-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/
          curl -sSfL -o /tmp/wasm-bindgen.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz
          echo "9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  /tmp/wasm-bindgen.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp && install /tmp/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl/wasm-bindgen* /usr/local/bin/
      # On SQLite's in-memory VFS: OPFS exists only in a browser's dedicated worker. What follows the
      # path goes to `cargo test` (after a `--` it would go to the tests).
      - run: wasm-pack test --node crates/duvet-e2e-wasm --locked

  # The Flutter plugin: its tests on the core built for this host, then the example's APK, whose
  # Android libraries cargokit builds. On the runner itself, for its Android SDK (and NDK 28).
  flutter:
    if: github.event_name != 'schedule' && !inputs.fuzz
    runs-on: [self-hosted, linux, x64, duvet]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: host
    steps:
      # In a folder of its own: the jobs in containers leave the workspace's checkout to root.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: host
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
      # rustup and its toolchains in this runner instance's own tool cache: the four instances share
      # one home, where two jobs installing at once would race.
      - name: Install Rust 1.99.1
        env:
          RUSTUP_HOME: ${{ runner.tool_cache }}/duvet-e2e/rustup
          CARGO_HOME: ${{ runner.tool_cache }}/duvet-e2e/cargo
        run: |
          [ -x "$CARGO_HOME/bin/rustup" ] || curl -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          "$CARGO_HOME/bin/rustup" toolchain install 1.99.1 --profile minimal
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: The plugin's tests
        env:
          RUSTUP_HOME: ${{ runner.tool_cache }}/duvet-e2e/rustup
          CARGO_HOME: ${{ runner.tool_cache }}/duvet-e2e/cargo
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/duvet-e2e/target
        run: |
          cargo build --locked --release -p duvet_e2e
          cd flutter/duvet_e2e && DUVET_E2E_LIB="$CARGO_TARGET_DIR/release/libduvet_e2e.so" flutter test
      # cargokit builds with rustup's stable toolchain, and adds the Android targets it needs.
      - name: The example's APK
        working-directory: host/flutter/duvet_e2e/example
        env:
          RUSTUP_HOME: ${{ runner.tool_cache }}/duvet-e2e/rustup
          CARGO_HOME: ${{ runner.tool_cache }}/duvet-e2e/cargo
        run: |
          flutter build apk --debug
          jar tf build/app/outputs/flutter-apk/app-debug.apk | grep -Fx lib/arm64-v8a/libduvet_e2e.so

  validator:
    if: github.event_name != 'schedule' && !inputs.fuzz
    runs-on: [self-hosted, linux, x64, duvet]
    container:
      image: docker.io/library/rust:1.99.1-bookworm
      volumes:
        - /var/cache/duvet-e2e:/cache
    env:
      CARGO_TARGET_DIR: /cache/target/validator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The module goes at once to where the Go test reads it, in this run's checkout: other runs
      # share the target directory.
      - run: |
          cargo build --locked --release --target wasm32-wasip1 -p duvet-e2e-rules -p duvet-e2e-validator
          mkdir -p target/wasm32-wasip1/release
          cp "$CARGO_TARGET_DIR/wasm32-wasip1/release/duvet_e2e_validator.wasm" target/wasm32-wasip1/release/
      # The module's exports exist on wasm32 alone, where the rust job's clippy doesn't look.
      - run: cargo clippy --locked --target wasm32-wasip1 -p duvet-e2e-validator -- -D warnings
      # The vectors expire with their key packages, so each run writes them anew.
      - run: cargo test --locked -p duvet-e2e-validator write_vectors -- --ignored
      - name: Install Go 1.27.4
        run: |
          curl -sSfL -o /tmp/go.tar.gz https://go.dev/dl/go1.27.4.linux-amd64.tar.gz
          echo "7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840  /tmp/go.tar.gz" | sha256sum -c -
          tar -xzf /tmp/go.tar.gz -C /usr/local
      - name: Run the module under wazero, as the API does
        working-directory: host-tests/go
        env:
          GOCACHE: /cache/go/build
          GOMODCACHE: /cache/go/mod
          GOFLAGS: -mod=readonly
          GOTOOLCHAIN: local
        run: /usr/local/go/bin/go test -count=1 ./...

  # Each format the core reads from the server or the disk, fuzzed 5 minutes a night with the pinned
  # nightly. The corpus grows in the runner's cache from night to night. Nothing is uploaded: a crash
  # prints its input, in base64, in the log.
  fuzz:
    if: github.event_name == 'schedule' || inputs.fuzz
    runs-on: [self-hosted, linux, x64, duvet]
    timeout-minutes: 120
    container:
      image: docker.io/library/rust:1.99.1-bookworm
      volumes:
        - /var/cache/duvet-e2e:/cache
    env:
      CARGO_TARGET_DIR: /cache/target/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly-2026-11-20 and cargo-fuzz 0.13.2
        run: |
          rustup toolchain install nightly-2026-11-20 --profile minimal
          cargo +1.99.1 install cargo-fuzz --version 0.13.2 --locked
      # cargo-fuzz takes no --locked: this fails if fuzz/Cargo.lock needs a change.
      - run: cargo +nightly-2026-11-20 fetch --locked --manifest-path fuzz/Cargo.toml
      - name: Fuzz each target for 5 minutes
        run: |
          failed=0
          for target in envelope parts direct segment history validator_input signed member_list; do
            mkdir -p "/cache/fuzz-corpus/$target"
            # The seeds the tests made are read too; new inputs go to the cache's corpus. No
            # allocation may pass 64 MiB, the bound the hostile inputs are held to.
            cargo +nightly-2026-11-20 fuzz run "$target" "/cache/fuzz-corpus/$target" "fuzz/seeds/$target" -- \
              -max_total_time=300 -timeout=10 -malloc_limit_mb=64 || failed=1
          done
          for input in fuzz/artifacts/*/*; do
            if [ -f "$input" ]; then echo "$input: $(base64 -w0 "$input")"; fi
          done
          exit "$failed"
