# What cargo-about counts for the release's THIRD-PARTY-NOTICES.txt, which notices/generate.sh makes.

# deny.toml's licences. Where a crate offers a choice, it's listed under the first of these it offers:
# MIT first, as a crate's MIT file carries its copyright notice, while cargo-about 0.9.3 takes an
# Apache-2.0 text without its appendix for the Pixar licence and prints Apache's standard text instead.
accepted = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "CC0-1.0", "ISC", "MPL-2.0", "Unicode-3.0", "Zlib"]
# The workspace's own crates aren't published, and what only tests use isn't shipped. Build dependencies
# stay, as openssl-src and sqlcipher-src are build dependencies whose C is compiled into the libraries.
private = { ignore = true }
ignore-dev-dependencies = true

# Each clarification gives a crate's licences, with their texts from the crate's own files, where
# cargo-about would miss one. notices/generate.sh fails when one no longer matches its crate's files.

# SQLCipher's sources bundle SQLite (its public-domain blessing) and LibTomCrypt (WTFPL), as deny.toml
# allows. cargo-about reads SQLCipher's licence as BSD-3-Clause-HP and finds neither of the other two.
[sqlcipher-src]
accepted = ["blessing", "WTFPL"]

[sqlcipher-src.clarify]
license = "MIT AND BSD-3-Clause AND blessing AND WTFPL"

[[sqlcipher-src.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "413f82e0f4f8191a8624a7b7b2c9809466f7f3d930ad52a74ad29f2dd907881d"

[[sqlcipher-src.clarify.files]]
path = "sqlcipher/LICENSE-sqlcipher"
license = "BSD-3-Clause"
checksum = "2a2826f6acf46fa650730cf42cbb22a642be33a7ef119c9c4f4bf6daf3bef48e"

[[sqlcipher-src.clarify.files]]
path = "sqlcipher/sqlcipher.c"
license = "blessing"
start = "** The author disclaims copyright to this source code."
end = "never taking more than you give."
checksum = "6be8b58249cfc9269b58f8ebf25f470f0354b105247713702b95bfcba28781d1"

[[sqlcipher-src.clarify.files]]
path = "sqlcipher/LICENSE-libtomcrypt"
license = "WTFPL"
checksum = "8f196cb13afd271f5e267fd29543fc454596382ad580e7592709492843996ac8"

# openssl-src's own code only builds OpenSSL, which is what the native libraries take: Apache-2.0 alone.
[openssl-src.clarify]
license = "Apache-2.0"

[[openssl-src.clarify.files]]
path = "openssl/LICENSE.txt"
checksum = "7d5450cb2d142651b8afa315b5f238efc805dad827d91ba367d8516bc9d49e7a"

# curve25519-dalek 4.1.3's file holds two BSD-3-Clause texts, its own and the Go Authors' for what it
# took from Go's ed25519, and cargo-about reads neither. 5.0.0's holds its own alone, which cargo-about
# reads: this checksum isn't its file's, so cargo-about warns about 5.0.0 and reads its file as usual.
[curve25519-dalek.clarify]
license = "BSD-3-Clause"

[[curve25519-dalek.clarify.files]]
path = "LICENSE"
checksum = "cca0bd3c4fcdba74145ef9d49c62337e2c9fbf9368288f11d0547f1b0273219f"

# dart-sys compiles the Dart SDK's dart_api_dl.c into the Flutter plugin, under the SDK's licence.
[dart-sys.clarify]
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"

[[dart-sys.clarify.files]]
path = "dart-sdk/LICENSE"
license = "BSD-3-Clause"
checksum = "2cfa3ee8e7512e6d44c854b986510810fadc815f93f890373b3a81c1b6ccd256"

# sqlite-wasm-rs compiles a printf and parts of musl into the WebAssembly. Its files give printf.c's
# notice and qsort.c's. musl's COPYRIGHT and Emscripten's licence, which it doesn't carry, are in
# notices/musl, which notices/generate.sh adds.
[sqlite-wasm-rs.clarify]
