# The dependency policy CI checks with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerable, unmaintained, unsound) fails the check, and so does a yanked crate.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only: nothing under the GPL or the AGPL.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates aren't published.
ignore = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
