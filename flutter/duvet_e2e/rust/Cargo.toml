[package]
# Cargokit names the library after the package: libduvet_e2e.so on Android.
name = "duvet_e2e"
description = "The core's Flutter plugin, through flutter_rust_bridge"
version.workspace = true
# flutter_rust_bridge's generated code is written for edition 2021.
edition = "2021"
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Renamed: this crate's own name is the core's.
duvet_e2e_core = { package = "duvet-e2e", path = "../../../crates/duvet-e2e" }
flutter_rust_bridge.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
