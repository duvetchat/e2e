name: Artifacts

# The core as each client takes it, which never compiles Rust: the C ABI for Linux, Windows and
# macOS, the web's WebAssembly, and the Flutter plugin for Linux, Android, macOS and iOS. Started by
# hand on main, it publishes them as the release artifacts-<commit>. A new workflow can only be
# started by hand from main, so a pull request that changes this one builds and checks them without
# publishing.
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/artifacts.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Apple's systems build only on a Mac. This job gets no token that writes: the Linux job takes its
  # files, puts them in SHA256SUMS with its own, and publishes them all.
  apple:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # The floor of the desktop's own macOS libraries (its scripts/build-native.ts), and the iOS
      # Runner's. arm64 simulators start at iOS 14, so rustc builds the simulator's slice for 14.0.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Beside the image's own Rust: rust-toolchain.toml names 1.99.1.
      - name: Install Rust 1.99.1 and the iOS targets
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 aarch64-apple-ios aarch64-apple-ios-sim
      # Each package on its own, as the Linux job builds them.
      - name: macOS arm64, the C ABI
        run: cargo build --locked --release -p duvet-e2e-ffi
      - name: macOS arm64, the Flutter plugin
        run: cargo build --locked --release -p duvet_e2e
      - name: iOS arm64, the Flutter plugin
        run: cargo build --locked --release --target aarch64-apple-ios -p duvet_e2e
      - name: The iOS simulator on arm64, the Flutter plugin
        run: cargo build --locked --release --target aarch64-apple-ios-sim -p duvet_e2e
      # flutter_rust_bridge opens the plugin on iOS as duvet_e2e.framework/duvet_e2e: each iOS library
      # becomes that framework, named by @rpath as an app embeds it, and the two one XCFramework. A new
      # name breaks the signature the linker gave it, so it's signed again, ad hoc, as the linker had:
      # an app signs it with its own as it embeds it.
      - name: Gather the files, the iOS libraries as one XCFramework
        run: |
          rm -rf dist apple && mkdir dist
          cp target/release/libduvet_e2e_ffi.dylib dist/macos-arm64-libduvet_e2e_ffi.dylib
          cp target/release/libduvet_e2e.dylib dist/macos-arm64-libduvet_e2e.dylib
          version=$(cargo pkgid -p duvet_e2e | sed 's/.*[#@]//')
          for slice in aarch64-apple-ios:iPhoneOS aarch64-apple-ios-sim:iPhoneSimulator; do
            framework="apple/${slice%%:*}/duvet_e2e.framework"
            mkdir -p "$framework"
            cp "target/${slice%%:*}/release/libduvet_e2e.dylib" "$framework/duvet_e2e"
            install_name_tool -id @rpath/duvet_e2e.framework/duvet_e2e "$framework/duvet_e2e"
            codesign --force --sign - "$framework/duvet_e2e"
            jq -n --arg platform "${slice#*:}" --arg version "$version" --arg minimum "$IPHONEOS_DEPLOYMENT_TARGET" '{
              CFBundleDevelopmentRegion: "en",
              CFBundleExecutable: "duvet_e2e",
              CFBundleIdentifier: "chat.duvet.duvet-e2e",
              CFBundleInfoDictionaryVersion: "6.0",
              CFBundleName: "duvet_e2e",
              CFBundlePackageType: "FMWK",
              CFBundleShortVersionString: $version,
              CFBundleSupportedPlatforms: [$platform],
              CFBundleVersion: $version,
              MinimumOSVersion: $minimum
            }' | plutil -convert xml1 -o "$framework/Info.plist" -
          done
          xcodebuild -create-xcframework \
            -framework apple/aarch64-apple-ios/duvet_e2e.framework \
            -framework apple/aarch64-apple-ios-sim/duvet_e2e.framework \
            -output apple/duvet_e2e.xcframework
          ditto -c -k --keepParent apple/duvet_e2e.xcframework dist/ios-duvet_e2e.xcframework.zip
      # Before the checks, so a run they fail still shows what it built. The Linux job's summary gives
      # every file's checksum.
      - name: Each file's size and the system each library is built for, in the summary
        run: |
          built_for() { vtool -show-build "$1" | awk '$1 == "platform" { platform = $2 } $1 == "minos" { print platform, $2 }'; }
          slices=apple/duvet_e2e.xcframework
          {
            echo "| File | Bytes | Built for |"
            echo "|---|---:|---|"
            for file in dist/*.dylib; do echo "| \`${file#dist/}\` | $(stat -f %z "$file") | $(built_for "$file") |"; done
            echo "| \`ios-duvet_e2e.xcframework.zip\` | $(stat -f %z dist/ios-duvet_e2e.xcframework.zip) | $(built_for "$slices/ios-arm64/duvet_e2e.framework/duvet_e2e"); $(built_for "$slices/ios-arm64-simulator/duvet_e2e.framework/duvet_e2e") |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # A Mac or an iPhone has only the system's own libraries; each library is built for its floor,
      # arm64 alone, with a valid signature: arm64 code without one doesn't run, not even ad hoc.
      - name: Each library needs only the system's own, for its floor, on arm64, signed
        run: |
          built_for() { vtool -show-build "$1" | awk '$1 == "platform" { platform = $2 } $1 == "minos" { print platform, $2 }'; }
          slices=apple/duvet_e2e.xcframework
          held=$(plutil -convert json -o - "$slices/Info.plist" | jq -r '[.AvailableLibraries[].LibraryIdentifier] | sort | join(" ")')
          [ "$held" = "ios-arm64 ios-arm64-simulator" ] || { echo "The XCFramework holds: $held"; exit 1; }
          for expected in \
            "dist/macos-arm64-libduvet_e2e_ffi.dylib MACOS 14.0" \
            "dist/macos-arm64-libduvet_e2e.dylib MACOS 14.0" \
            "$slices/ios-arm64/duvet_e2e.framework/duvet_e2e IOS 13.0" \
            "$slices/ios-arm64-simulator/duvet_e2e.framework/duvet_e2e IOSSIMULATOR 14.0"; do
            read -r binary system <<< "$expected"
            # otool -L names a library's own ID first.
            own=$(otool -D "$binary" | tail -n +2)
            needed=$(otool -L "$binary" | tail -n +2 | awk '{ print $1 }' | grep -Fvx -- "$own")
            echo "$binary:"; echo "$needed"
            others=$(grep -Ev '^(/usr/lib/|/System/Library/)' <<< "$needed" || true)
            [ -z "$others" ] || { echo "$binary needs more than the system's: $others"; exit 1; }
            [ "$(built_for "$binary")" = "$system" ] || { echo "$binary is built for $(built_for "$binary"), not $system"; exit 1; }
            [ "$(lipo -archs "$binary")" = arm64 ] || { echo "$binary is $(lipo -archs "$binary")"; exit 1; }
            codesign --verify --strict "$binary"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple
          path: dist/
          if-no-files-found: error
          retention-days: 1

  artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Apple's files come from the apple job.
    needs: apple
    # One run at a time, and every run waits its turn: a run publishes the files it built.
    concurrency:
      group: artifacts
      queue: max
    permissions:
      contents: write
    container:
      image: docker.io/library/rust:1.99.1-bookworm
    env:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/target/artifacts
      # The NDK of Flutter 3.47.7, which the job installs: GitHub's image lacks it.
      NDK_BIN: /opt/android-sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The builds run every dependency's build script: none of them finds the token that publishes.
          persist-credentials: false
      # The registry and the target directory, kept between runs as ci.yml keeps them. A release runs
      # on main, so it reads only what main's runs saved.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /cache/cargo/registry/index
            /cache/cargo/registry/cache
            /cache/target/artifacts
          key: artifacts-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: artifacts-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Install NDK 28.2.13676358
        run: |
          curl -sSfL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          echo "dfb20d396df28ca02a8c708314b814a4d961dc9074f9a161932746f815aa552f  /tmp/ndk.zip" | sha256sum -c -
          mkdir -p /opt/android-sdk/ndk
          unzip -q /tmp/ndk.zip -d /opt/android-sdk/ndk && rm /tmp/ndk.zip
          mv /opt/android-sdk/ndk/android-ndk-r28c /opt/android-sdk/ndk/28.2.13676358
          [ -x "$NDK_BIN/aarch64-linux-android21-clang" ] || { echo "No NDK at $NDK_BIN"; exit 1; }
      # SQLCipher's C is compiled for wasm32 with clang, and for Windows with mingw-w64.
      - name: Install clang, mingw-w64, gh, wasm-bindgen 0.2.130 and the Windows and Android targets
        run: |
          apt-get update && apt-get install -y --no-install-recommends clang lld llvm gcc-mingw-w64-x86-64 gh
          curl -sSfL -o /tmp/wasm-bindgen.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz
          echo "9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  /tmp/wasm-bindgen.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp && install /tmp/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl/wasm-bindgen /usr/local/bin/
          rustup target add x86_64-pc-windows-gnu aarch64-linux-android
      # Each package on its own, as CI builds it: built together, they'd share their dependencies' features.
      - name: Linux x64, the C ABI
        run: cargo build --locked --release -p duvet-e2e-ffi
      - name: Linux x64, the Flutter plugin
        run: cargo build --locked --release -p duvet_e2e
      - name: Windows x64, the C ABI
        run: cargo build --locked --release --target x86_64-pc-windows-gnu -p duvet-e2e-ffi
      - name: The web, the core in WebAssembly
        run: cargo build --locked --release --target wasm32-unknown-unknown -p duvet-e2e-wasm
      # Linked as cargokit links it for an APK: the NDK's clang for API 21, the lowest it takes.
      - name: Android arm64-v8a, the Flutter plugin
        env:
          CC_aarch64_linux_android: ${{ env.NDK_BIN }}/aarch64-linux-android21-clang
          AR_aarch64_linux_android: ${{ env.NDK_BIN }}/llvm-ar
          RANLIB_aarch64_linux_android: ${{ env.NDK_BIN }}/llvm-ranlib
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.NDK_BIN }}/aarch64-linux-android21-clang
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: -C link-arg=-Wl,--hash-style=both -C link-arg=-Wl,-z,max-page-size=16384
        run: cargo build --locked --release --target aarch64-linux-android -p duvet_e2e
      # Apple's files as the apple job uploaded them: download-artifact checks their digest.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apple
          path: apple
      # A release's files sit side by side, so the Android library takes its folder in its name.
      - name: Gather the files and their SHA256SUMS
        run: |
          rm -rf dist /tmp/web && mkdir dist
          cp "$CARGO_TARGET_DIR/release/libduvet_e2e_ffi.so" "$CARGO_TARGET_DIR/release/libduvet_e2e.so" dist/
          cp "$CARGO_TARGET_DIR/x86_64-pc-windows-gnu/release/duvet_e2e_ffi.dll" dist/
          cp "$CARGO_TARGET_DIR/aarch64-linux-android/release/libduvet_e2e.so" dist/android-arm64-v8a-libduvet_e2e.so
          wasm-bindgen --target web --out-name duvet_e2e_wasm --out-dir /tmp/web "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/duvet_e2e_wasm.wasm"
          cp /tmp/web/duvet_e2e_wasm.js /tmp/web/duvet_e2e_wasm_bg.wasm dist/
          cp apple/* dist/
          cd dist && sha256sum -- * > SHA256SUMS
      # Before the checks, so a run they fail still shows what it built; in the log too. The desktop's
      # and mobile's Linux tests load the Linux libraries on other machines, whose glibc may be older.
      - name: Each file's size, the checksums and the glibc the Linux libraries need, in the summary
        run: |
          glibc=$(objdump -T dist/libduvet_e2e_ffi.so dist/libduvet_e2e.so | grep -o 'GLIBC_[0-9][0-9.]*' | sort -uV | tail -n1)
          {
            echo "| File | Bytes |"
            echo "|---|---:|"
            for file in dist/*; do echo "| \`${file#dist/}\` | $(stat -c %s "$file") |"; done
            echo
            echo "The Linux libraries need ${glibc/_/ } or later."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # A user's PC has none of mingw-w64's runtime (libgcc_s, libwinpthread): the DLL may import
      # nothing but Windows' own DLLs, or it must link that runtime statically.
      - name: The DLL imports only Windows' own DLLs
        run: |
          imports=$(x86_64-w64-mingw32-objdump -p dist/duvet_e2e_ffi.dll | sed -n 's/^[[:space:]]*DLL Name: //p' | tr '[:upper:]' '[:lower:]' | sort -u)
          echo "$imports"
          [ -n "$imports" ] || { echo "objdump listed no imports"; exit 1; }
          others=$(grep -Evx '(advapi32|bcrypt|bcryptprimitives|crypt32|gdi32|kernel32|msvcrt|ncrypt|ntdll|ole32|oleaut32|rpcrt4|secur32|shell32|ucrtbase|user32|userenv|ws2_32|api-ms-win-[a-z0-9-]+)\.dll' <<< "$imports" || true)
          [ -z "$others" ] || { echo "Not Windows' own: $others"; exit 1; }
      - name: The Android library needs only libc, libm, libdl and liblog, and has 16 KiB pages
        run: |
          lib=dist/android-arm64-v8a-libduvet_e2e.so
          needed=$("$NDK_BIN/llvm-readelf" --dynamic "$lib" | sed -n 's/.*(NEEDED).*\[\(.*\)\]$/\1/p')
          echo "$needed"
          [ -n "$needed" ] || { echo "llvm-readelf listed no libraries"; exit 1; }
          others=$(grep -Evx 'lib(c|m|dl|log)\.so' <<< "$needed" || true)
          [ -z "$others" ] || { echo "It needs more: $others"; exit 1; }
          aligns=$("$NDK_BIN/llvm-readelf" --program-headers --wide "$lib" | awk '$1 == "LOAD" { print $NF }')
          [ -n "$aligns" ] || { echo "llvm-readelf listed no LOAD segments"; exit 1; }
          for align in $aligns; do
            (( align % 16384 == 0 )) || { echo "A LOAD segment is aligned to $align, not 16 KiB"; exit 1; }
          done
      # gh creates the release as a draft and publishes it once every file is up. A commit's release
      # is made once: a second run fails, as its tag exists.
      - name: Publish the release artifacts-<commit>
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="artifacts-${GITHUB_SHA:0:7}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" \
            --notes "The core built for each client from $GITHUB_SHA, by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID." \
            ./*
