name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The runner keeps /var/cache/duvet-e2e between runs: the registry, and a target directory per job.
  CARGO_HOME: /cache/cargo

# Every job runs in the same image, whose toolchain matches rust-toolchain.toml, so the runner's
# instances never install a toolchain into the home they share.
jobs:
  rust:
    runs-on: [self-hosted, linux, x64, duvet]
    container:
      image: docker.io/library/rust:1.99.1-bookworm
      volumes:
        - /var/cache/duvet-e2e:/cache
    env:
      CARGO_TARGET_DIR: /cache/target/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    runs-on: [self-hosted, linux, x64, duvet]
    container:
      image: docker.io/library/rust:1.99.1-bookworm
      volumes:
        - /var/cache/duvet-e2e:/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-deny 0.22.0
        run: |
          curl -sSfL -o /tmp/cargo-deny.tar.gz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.22.0/cargo-deny-0.22.0-x86_64-unknown-linux-musl.tar.gz
          echo "98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786  /tmp/cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp
          install /tmp/cargo-deny-0.22.0-x86_64-unknown-linux-musl/cargo-deny /usr/local/bin/
      - run: cargo deny --locked check

  wasm:
    runs-on: [self-hosted, linux, x64, duvet]
    container:
      image: docker.io/library/rust:1.99.1-bookworm
      volumes:
        - /var/cache/duvet-e2e:/cache
    env:
      CARGO_TARGET_DIR: /cache/target/wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SQLCipher's C is compiled for wasm32, which takes clang: the image has gcc alone.
      - run: apt-get update && apt-get install -y --no-install-recommends clang lld llvm
      - run: cargo build --locked --target wasm32-unknown-unknown -p duvet-e2e-rules -p duvet-e2e -p duvet-e2e-wasm

  validator:
    runs-on: [self-hosted, linux, x64, duvet]
    container:
      image: docker.io/library/rust:1.99.1-bookworm
      volumes:
        - /var/cache/duvet-e2e:/cache
    env:
      CARGO_TARGET_DIR: /cache/target/validator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The module goes at once to where the Go test reads it, in this run's checkout: other runs
      # share the target directory.
      - run: |
          cargo build --locked --release --target wasm32-wasip1 -p duvet-e2e-rules -p duvet-e2e-validator
          mkdir -p target/wasm32-wasip1/release
          cp "$CARGO_TARGET_DIR/wasm32-wasip1/release/duvet_e2e_validator.wasm" target/wasm32-wasip1/release/
      # The module's exports exist on wasm32 alone, where the rust job's clippy doesn't look.
      - run: cargo clippy --locked --target wasm32-wasip1 -p duvet-e2e-validator -- -D warnings
      # The vectors expire with their key packages, so each run writes them anew.
      - run: cargo test --locked -p duvet-e2e-validator write_vectors -- --ignored
      - name: Install Go 1.27.4
        run: |
          curl -sSfL -o /tmp/go.tar.gz https://go.dev/dl/go1.27.4.linux-amd64.tar.gz
          echo "7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840  /tmp/go.tar.gz" | sha256sum -c -
          tar -xzf /tmp/go.tar.gz -C /usr/local
      - name: Run the module under wazero, as the API does
        working-directory: host-tests/go
        env:
          GOCACHE: /cache/go/build
          GOMODCACHE: /cache/go/mod
          GOFLAGS: -mod=readonly
          GOTOOLCHAIN: local
        run: /usr/local/go/bin/go test -count=1 ./...
